# Stack de desarrollo/demo local: PostgreSQL + MinIO + backend + frontend. Es el mismo
# stack que produccion (ver docker-compose.stack.yml y docs/09-entornos-pre-pro.md), pero
# con puertos publicados al host, NODE_ENV=development y secretos de ejemplo.
#
# Uso:
#   cd infra
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rave
      POSTGRES_PASSWORD: ${DB_PASSWORD:-R4veDevPassw0rd}
      POSTGRES_DB: ravedb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rave -d ravedb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # 9000 = API S3, 9001 = consola web para inspeccionar los objetos subidos.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../apps/backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Stack local/demo: se marca explicitamente como development (la imagen fija
      # NODE_ENV=production por defecto). Asi la validacion de arranque acepta los secretos
      # de ejemplo de abajo y Swagger queda disponible en /docs. El despliegue real corre
      # como production, donde esos secretos de ejemplo hacen fallar el arranque.
      NODE_ENV: "development"
      DATABASE_URL: "postgresql://rave:${DB_PASSWORD:-R4veDevPassw0rd}@db:5432/ravedb"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-cambiar}
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-cambiar}
      JWT_REFRESH_EXPIRES_IN: "7d"
      PORT: "3001"
      CORS_ORIGIN: "http://localhost:3000"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: "boletos-pdf"
      THROTTLE_TTL: "60"
      THROTTLE_LIMIT: "100"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@rave.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-CambiameYa123!}
    ports:
      - "3001:3001"
    # Override del entrypoint de la imagen: aplica las migraciones igual que en produccion
    # y ademas siembra roles, permisos y el usuario administrador (el seed es idempotente,
    # usa upsert, asi que puede correr en cada arranque).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        npx prisma migrate deploy &&
        npx prisma db seed &&
        node dist/main.js

  frontend:
    build:
      context: ../apps/frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:3001"
      ACCESS_TOKEN_MAX_AGE_SECONDS: "900"
      REFRESH_TOKEN_MAX_AGE_SECONDS: "604800"
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  minio-data:
